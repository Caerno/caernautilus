name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 1 * *"   # monthly, to catch pandas/sklearn breaking us

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install .[test]
      - run: pytest -q
        env:
          MPLBACKEND: Agg
